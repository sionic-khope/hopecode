appId: dev.deltax.app
productName: deltax
copyright: Copyright © 2026 deltax
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# SIL OFL 1.1 requires the license text to travel with the bundled fonts (Galmuri, Silkscreen, JetBrains Mono).
extraResources:
  - from: src/renderer/assets/fonts/licenses
    to: font-licenses
  # codex-acp 2.x adapter compiled to one native binary (scripts/build-codex-acp.mjs, `predist:dir`). Spawned
  # directly with CODEX_PATH=<installed codex>; the runAsNode fuse rules out its Node script. +x: afterPack.mjs.
  - from: build/bin/codex-acp
    to: bin/codex-acp
asarUnpack:
  - "**/node_modules/node-pty/**"
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-darwin-*/**"
mac:
  icon: build/icon.icns
  target:
    - target: dir
      arch:
        - arm64
  identity: "-"
  category: public.app-category.developer-tools
npmRebuild: true
# node-pty's spawn-helper binary must keep its +x bit through pack/unpack, or pty.spawn() fails and the
# terminal never opens (H1). Belt-and-suspenders on top of npmRebuild: see scripts/afterPack.mjs.
afterPack: scripts/afterPack.mjs
# Harden the packaged Electron binary (L4). ASAR integrity needs the macOS build to embed the asar hash
# (electron-builder does this when the fuse is on).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
